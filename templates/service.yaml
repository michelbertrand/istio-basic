{{- if .Values.service.create -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "istio-basic.name" . }}
  labels:
    {{- toYaml .Values.service.labels | nindent 4 }}
spec:
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "istio-basic.selectorLabels" . | nindent 4 }}
{{- end }}
